<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#8b949e"/></marker></defs>
<rect width="980" height="610" rx="12" fill="#0d1117"/>
<text x="490.0" y="32" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">VerifiedCallKit&#160;&#8212;&#160;verify&#160;before&#160;you&#160;retry</text>
<rect x="380" y="55" width="220" height="60" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
<text x="490.0" y="77" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">effect.perform(ctx)</text>
<text x="490.0" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">same&#160;key&#160;on&#160;every&#160;attempt</text>
<rect x="40" y="165" width="250" height="74" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
<text x="165.0" y="187" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">reported&#160;success</text>
<text x="165.0" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">confirmSuccess?&#160;probe&#160;it&#160;too:</text>
<text x="165.0" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">absent&#160;after&#160;settle&#160;=&#160;lost&#160;write</text>
<line x1="380" y1="100" x2="290" y2="180" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300" y="132" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d2a8ff">returns</text>
<rect x="380" y="165" width="220" height="60" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
<text x="490.0" y="187" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">FailureClassifier</text>
<text x="490.0" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">CancellationError&#160;stops&#160;first</text>
<line x1="490" y1="115" x2="490" y2="165" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="496" y="145" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d2a8ff">throws</text>
<rect x="40" y="290" width="200" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="140.0" y="312" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">retryable</text>
<text x="140.0" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">next&#160;attempt&#160;after&#160;retryDelay</text>
<rect x="260" y="290" width="200" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="360.0" y="312" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">rejected</text>
<text x="360.0" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">failed&#160;(unresolved&#160;if&#160;an</text>
<text x="360.0" y="345" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">earlier&#160;attempt&#160;is&#160;in&#160;doubt)</text>
<rect x="560" y="280" width="380" height="82" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<text x="750.0" y="302" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">reconcile&#160;through&#160;VisibilityWindow</text>
<text x="750.0" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">probe(ctx)&#160;every&#160;interval,&#160;up&#160;to&#160;maxProbes;</text>
<text x="750.0" y="335" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">an&#160;absence&#160;before&#160;settle&#160;proves&#160;nothing</text>
<line x1="430" y1="225" x2="150" y2="290" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="470" y1="225" x2="360" y2="290" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="560" y1="225" x2="700" y2="280" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="650" y="248" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d2a8ff">inDoubt</text>
<rect x="470" y="420" width="160" height="74" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
<text x="550.0" y="442" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#7ee787">applied</text>
<text x="550.0" y="460" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">.recovered(output)</text>
<text x="550.0" y="475" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">not&#160;performed&#160;again</text>
<rect x="650" y="420" width="150" height="74" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
<text x="725.0" y="442" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#7ee787">absent</text>
<text x="725.0" y="460" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">after&#160;settle:</text>
<text x="725.0" y="475" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">safe&#160;redo</text>
<rect x="820" y="420" width="140" height="74" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="890.0" y="442" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#ffa657">unresolved</text>
<text x="890.0" y="460" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">UnresolvedPolicy:</text>
<text x="890.0" y="475" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">escalate&#160;|&#160;redoWithKey</text>
<text x="890.0" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">|&#160;redo&#160;(risked)</text>
<line x1="680" y1="362" x2="560" y2="420" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="750" y1="362" x2="725" y2="420" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="820" y1="362" x2="880" y2="420" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="420" width="400" height="74" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
<text x="240.0" y="442" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">EffectPlan</text>
<text x="240.0" y="460" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">pre-probe&#160;each&#160;step;&#160;skip&#160;ones&#160;an&#160;earlier&#160;run&#160;applied;</text>
<text x="240.0" y="475" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">stop&#160;at&#160;the&#160;first&#160;step&#160;that&#160;does&#160;not&#160;settle;</text>
<text x="240.0" y="490" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">a&#160;rerun&#160;resumes&#160;at&#160;the&#160;first&#160;missing&#160;step</text>
<rect x="40" y="520" width="920" height="66" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="500.0" y="542" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#e6edf3">VerificationReport</text>
<text x="500.0" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">duplicatesAvoided&#160;&#183;&#160;lateAppearances&#160;&#183;&#160;lostWrites&#160;&#183;&#160;safe&#160;/&#160;keyed&#160;/&#160;risked&#160;redos&#160;&#183;&#160;probes&#160;per&#160;duplicate&#160;avoided</text>
<text x="500.0" y="575" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e">Resolution:&#160;succeeded&#160;&#183;&#160;recovered&#160;&#183;&#160;unconfirmed&#160;&#183;&#160;failed&#160;&#183;&#160;unresolved&#160;&#160;&#160;(effectApplied:&#160;true&#160;/&#160;false&#160;/&#160;nil)</text>
</svg>
