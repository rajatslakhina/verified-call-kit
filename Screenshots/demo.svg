<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="794" viewBox="0 0 1062 794">
<rect width="1062" height="794" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/><circle cx="40" cy="18" r="6" fill="#ffbd2e"/><circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text x="531.0" y="22" text-anchor="middle" font-family="Menlo,monospace" font-size="12" fill="#8b949e">$&#160;swift&#160;run&#160;VerifiedCallDemo</text>
<text x="16" y="50" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">VerifiedCallKit&#160;demo:&#160;verify&#160;before&#160;you&#160;retry</text>
<text x="16" y="68" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="86" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">===&#160;1.&#160;Twenty&#160;transfers,&#160;six&#160;injected&#160;faults:&#160;blind&#160;retry&#160;vs&#160;verify-before-retry&#160;===</text>
<text x="16" y="104" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">key&#160;&#160;fault&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;blind&#160;retry&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;verify-before-retry</text>
<text x="16" y="122" font-family="Menlo,monospace" font-size="12" fill="#ffa657">t03&#160;&#160;timeout&#160;after&#160;commit&#160;&#160;&#160;&#160;&#160;charged&#160;2x&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x,&#160;recovered&#160;(in&#160;doubt&#160;-&gt;&#160;applied&#160;at&#160;probe&#160;1)</text>
<text x="16" y="140" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">t07&#160;&#160;timeout&#160;before&#160;commit&#160;&#160;&#160;&#160;charged&#160;1x&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x,&#160;succeeded&#160;(in&#160;doubt&#160;-&gt;&#160;absent&#160;after&#160;the&#160;settle&#160;window&#160;(5&#160;probe(s));&#160;succeeded)</text>
<text x="16" y="158" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">t09&#160;&#160;429,&#160;then&#160;ok&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x,&#160;succeeded&#160;(retryable:&#160;429&#160;rate&#160;limited;&#160;succeeded)</text>
<text x="16" y="176" font-family="Menlo,monospace" font-size="12" fill="#ffa657">t12&#160;&#160;timeout&#160;after&#160;commit&#160;&#160;&#160;&#160;&#160;charged&#160;2x&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x,&#160;recovered&#160;(in&#160;doubt&#160;-&gt;&#160;applied&#160;at&#160;probe&#160;1)</text>
<text x="16" y="194" font-family="Menlo,monospace" font-size="12" fill="#ffa657">t15&#160;&#160;timeout&#160;after&#160;commit&#160;&#160;&#160;&#160;&#160;charged&#160;2x&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x,&#160;recovered&#160;(in&#160;doubt&#160;-&gt;&#160;applied&#160;at&#160;probe&#160;1)</text>
<text x="16" y="212" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">t18&#160;&#160;timeout&#160;before&#160;commit&#160;&#160;&#160;&#160;charged&#160;1x&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;charged&#160;1x,&#160;succeeded&#160;(in&#160;doubt&#160;-&gt;&#160;absent&#160;after&#160;the&#160;settle&#160;window&#160;(5&#160;probe(s));&#160;succeeded)</text>
<text x="16" y="230" font-family="Menlo,monospace" font-size="12" fill="#ffa657">blind&#160;retry:&#160;23&#160;charges&#160;for&#160;20&#160;transfers,&#160;$247.50&#160;overcharged</text>
<text x="16" y="248" font-family="Menlo,monospace" font-size="12" fill="#7ee787">verified&#160;&#160;&#160;:&#160;20&#160;charges&#160;for&#160;20&#160;transfers,&#160;$0.00&#160;overcharged</text>
<text x="16" y="266" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">verified&#160;cost:&#160;13&#160;probes;&#160;3&#160;duplicates&#160;avoided,&#160;2&#160;safe&#160;redos,&#160;23&#160;performs</text>
<text x="16" y="284" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="302" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">===&#160;2.&#160;The&#160;write&#160;lands&#160;on&#160;a&#160;replica&#160;1.5s&#160;late&#160;===</text>
<text x="16" y="320" font-family="Menlo,monospace" font-size="12" fill="#ffa657">one&#160;immediate&#160;probe:&#160;succeeded,&#160;charged&#160;2x&#160;&#160;lookups:&#160;t=0.0s&#160;&#160;absent</text>
<text x="16" y="338" font-family="Menlo,monospace" font-size="12" fill="#7ee787">2s&#160;settle&#160;window&#160;&#160;&#160;:&#160;recovered,&#160;charged&#160;1x&#160;&#160;lookups:&#160;t=0.0s&#160;&#160;absent,&#160;t=0.5s&#160;&#160;absent,&#160;t=1.0s&#160;&#160;absent,&#160;t=1.5s&#160;&#160;found&#160;rcpt:late:$42.00</text>
<text x="16" y="356" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">An&#160;absence&#160;read&#160;before&#160;the&#160;settle&#160;window&#160;has&#160;passed&#160;is&#160;not&#160;evidence.&#160;The&#160;window&#160;costs</text>
<text x="16" y="374" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">4&#160;lookups&#160;and&#160;1.5s&#160;here;&#160;believing&#160;the&#160;first&#160;lookup&#160;cost&#160;a&#160;second&#160;$42.00&#160;charge.</text>
<text x="16" y="392" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="410" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">===&#160;3.&#160;The&#160;lookup&#160;endpoint&#160;is&#160;down:&#160;what&#160;each&#160;UnresolvedPolicy&#160;does&#160;===</text>
<text x="16" y="428" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">escalate&#160;&#160;&#160;&#160;server&#160;no&#160;dedup&#160;&#160;&#160;&#160;&#160;&#160;&#160;-&gt;&#160;unresolved&#160;charged&#160;1x&#160;&#160;attempt&#160;1&#160;is&#160;in&#160;doubt:&#160;probe&#160;failed:&#160;503&#160;lookup&#160;unavailable</text>
<text x="16" y="446" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">redoWithKey&#160;server&#160;dedups&#160;by&#160;key&#160;&#160;-&gt;&#160;succeeded&#160;&#160;charged&#160;1x&#160;&#160;8&#160;lookups&#160;failed,&#160;then&#160;a&#160;keyed&#160;redo</text>
<text x="16" y="464" font-family="Menlo,monospace" font-size="12" fill="#ffa657">redo&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;server&#160;no&#160;dedup&#160;&#160;&#160;&#160;&#160;&#160;&#160;-&gt;&#160;succeeded&#160;&#160;charged&#160;2x&#160;&#160;8&#160;lookups&#160;failed,&#160;then&#160;a&#160;risked&#160;redo</text>
<text x="16" y="482" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="500" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">===&#160;4.&#160;reserve&#160;-&gt;&#160;charge&#160;-&gt;&#160;receipt,&#160;interrupted&#160;at&#160;the&#160;charge&#160;===</text>
<text x="16" y="518" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">run&#160;1:&#160;stopped&#160;at&#160;step&#160;2,&#160;done&#160;so&#160;far:&#160;["reserve"]</text>
<text x="16" y="536" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;&#160;&#160;&#160;&#160;&#160;&#160;attempt&#160;1&#160;is&#160;in&#160;doubt:&#160;probe&#160;failed:&#160;503&#160;lookup&#160;unavailable</text>
<text x="16" y="554" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">run&#160;2:&#160;complete=true;&#160;reserve&#160;(already&#160;done),&#160;charge&#160;(already&#160;done),&#160;receipt&#160;(performed)</text>
<text x="16" y="572" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">plain&#160;rerun&#160;&#160;&#160;:&#160;reserve&#160;2x,&#160;charge&#160;2x,&#160;receipt&#160;1x</text>
<text x="16" y="590" font-family="Menlo,monospace" font-size="12" fill="#7ee787">verified&#160;rerun:&#160;reserve&#160;1x,&#160;charge&#160;1x,&#160;receipt&#160;1x</text>
<text x="16" y="608" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="626" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">===&#160;5.&#160;The&#160;service&#160;answers&#160;200&#160;OK&#160;and&#160;drops&#160;the&#160;write&#160;===</text>
<text x="16" y="644" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">confirmSuccess=false&#160;-&gt;&#160;succeeded&#160;&#160;&#160;receipt&#160;rcpt:lost:$25.00,&#160;charged&#160;0x,&#160;lostWrites=0</text>
<text x="16" y="662" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">confirmSuccess=true&#160;&#160;-&gt;&#160;unconfirmed&#160;receipt&#160;rcpt:lost:$25.00,&#160;charged&#160;0x,&#160;lostWrites=1</text>
<text x="16" y="680" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">&#160;</text>
<text x="16" y="698" font-family="Menlo,monospace" font-size="12" fill="#79c0ff">===&#160;Report&#160;for&#160;scenario&#160;1's&#160;verified&#160;caller&#160;===</text>
<text x="16" y="716" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">calls&#160;20,&#160;performs&#160;23,&#160;probes&#160;13</text>
<text x="16" y="734" font-family="Menlo,monospace" font-size="12" fill="#7ee787">succeeded&#160;17,&#160;recovered&#160;3,&#160;failed&#160;0,&#160;unresolved&#160;0</text>
<text x="16" y="752" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">duplicates&#160;avoided&#160;3,&#160;late&#160;appearances&#160;0,&#160;safe&#160;redos&#160;2</text>
<text x="16" y="770" font-family="Menlo,monospace" font-size="12" fill="#c9d1d9">probes&#160;per&#160;duplicate&#160;avoided:&#160;4.33</text>
